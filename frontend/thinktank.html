<!DOCTYPE html>
<html>
<head>
    <title>Think Tank</title>
    <style>
        body { 
            font-family: 'Press Start 2P', Arial, sans-serif; 
            margin: 0;
            padding: 20px;
            background: #2c3e50;
        }
        canvas {
            border: 4px solid #34495e;
            border-radius: 4px;
            background: #ecf0f1;
            margin: 20px auto;
            display: block;
        }
        .controls {
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 60px;
            margin: 10px 0;
            padding: 8px;
            font-family: inherit;
            border: 2px solid #34495e;
            border-radius: 4px;
        }
        button { 
            margin: 5px;
            padding: 8px 15px;
            background: #2980b9;
            color: white;
            border: 2px solid #2573a7;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background: #3498db;
        }
        .cancel-button {
            background: #c0392b;
            border-color: #a93326;
        }
        .cancel-button:hover {
            background: #e74c3c;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="thinkTankCanvas"></canvas>
    
    <div class="controls">
        <textarea id="messageInput" placeholder="Enter your message here..."></textarea>
        <button onclick="sendMessage()">Send Message</button>
        <button onclick="clearResponses()">Clear Messages</button>
        <button id="cancelButton" onclick="cancelProcess()" class="cancel-button" disabled>Stop Process</button>
    </div>

    <script>
        const canvas = document.getElementById('thinkTankCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = 800;
        canvas.height = 600;

        // Character class to manage agents
        class Character {
            constructor(x, y, color, name) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.name = name;
                this.message = '';
                this.messageTimer = 0;
            }

            draw(ctx) {
                // Draw character (simple 8-bit style person)
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 30, 50);
                
                // Draw message bubble if active
                if (this.message && this.messageTimer > 0) {
                    this.drawMessageBubble(ctx);
                }
            }

            drawMessageBubble(ctx) {
                const padding = 10;
                const maxWidth = 150;
                
                ctx.font = '12px "Press Start 2P"';
                const words = this.message.split(' ');
                let lines = [];
                let currentLine = words[0];

                // Word wrap
                for (let i = 1; i < words.length; i++) {
                    const word = words[i];
                    const width = ctx.measureText(currentLine + " " + word).width;
                    if (width < maxWidth) {
                        currentLine += " " + word;
                    } else {
                        lines.push(currentLine);
                        currentLine = word;
                    }
                }
                lines.push(currentLine);

                // Draw bubble
                const bubbleHeight = lines.length * 20 + padding * 2;
                const bubbleWidth = maxWidth + padding * 2;
                const bubbleX = this.x - bubbleWidth/2 + 15;
                const bubbleY = this.y - bubbleHeight - 20;

                // Bubble background
                ctx.fillStyle = 'white';
                ctx.fillRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight);
                ctx.strokeStyle = 'black';
                ctx.strokeRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight);

                // Text
                ctx.fillStyle = 'black';
                lines.forEach((line, i) => {
                    ctx.fillText(line, bubbleX + padding, bubbleY + padding + (i * 20));
                });
            }

            showMessage(message) {
                this.message = message;
                this.messageTimer = 300; // Show message for 5 seconds
            }

            update() {
                if (this.messageTimer > 0) {
                    this.messageTimer--;
                }
            }
        }

        // Create characters
        const characters = [
            new Character(100, 300, '#3498db', 'Director'),
            new Character(250, 300, '#2ecc71', 'Analyst'),
            new Character(400, 300, '#f1c40f', 'Critic'),
            new Character(550, 300, '#e74c3c', 'Expert'),
            new Character(700, 300, '#9b59b6', 'Quality')
        ];

        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw room
            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw table
            ctx.fillStyle = '#95a5a6';
            ctx.fillRect(50, 400, canvas.width - 100, 20);
            
            // Update and draw characters
            characters.forEach(char => {
                char.update();
                char.draw(ctx);
            });
            
            requestAnimationFrame(animate);
        }

        // Start animation
        animate();

        // Modify existing functions to work with canvas
        function showMessage(agentId, message) {
            const agentMap = {
                'director-1': 0,
                'analyst-1': 1,
                'critic-1': 2,
                'expert-1': 3,
                'quality-gate': 4
            };
            
            const charIndex = agentMap[agentId];
            if (charIndex !== undefined) {
                characters[charIndex].showMessage(message);
            }
        }

        // ... rest of your existing JavaScript code ...
        // (Keep all the existing functions, just update the addResponse function)

        function addResponse(message) {
            if (typeof message === 'object' && message.agentId) {
                showMessage(message.agentId, message.content || JSON.stringify(message));
            }
        }
    </script>
</body>
</html>
